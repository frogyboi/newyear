<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10101a">
<title>Open When — A Little Something For You</title>
<style>
:root{
  --bg:#090910; --card:#12121d; --card2:#181827; --text:#f5f3ff;
  --muted:#aaa7bc; --accent:#b9a7ff; --accent2:#7ee7d8;
  --border:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(185,167,255,.16),transparent 28%),
    radial-gradient(circle at 80% 80%,rgba(126,231,216,.10),transparent 25%),
    var(--bg);
}
.container{width:min(920px,92%);margin:auto;padding:56px 0 70px}
.hero{text-align:center;margin-bottom:34px}
.badge{
  display:inline-block;padding:7px 12px;border:1px solid var(--border);
  border-radius:999px;color:var(--muted);font-size:.78rem;letter-spacing:.08em;
  text-transform:uppercase;background:rgba(255,255,255,.03)
}
h1{font-size:clamp(2.5rem,8vw,5rem);line-height:.95;margin:18px 0 14px;letter-spacing:-.06em}
.hero p{max-width:600px;margin:auto;color:var(--muted);font-size:1.05rem;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{
  position:relative;border:1px solid var(--border);background:linear-gradient(145deg,var(--card),var(--card2));
  border-radius:22px;padding:22px;text-align:left;color:var(--text);cursor:pointer;
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.card:hover{transform:translateY(-4px);border-color:rgba(185,167,255,.45);box-shadow:0 15px 40px rgba(0,0,0,.25)}
.icon{font-size:1.7rem;margin-bottom:18px}.label{font-weight:700;font-size:1.03rem}.hint{color:var(--muted);font-size:.84rem;margin-top:7px}
.footer{text-align:center;color:#777487;font-size:.8rem;margin-top:32px}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:5;
}
.modal.show{display:flex}
.paper{
  width:min(650px,100%);max-height:86vh;overflow:auto;border:1px solid var(--border);
  border-radius:28px;padding:30px;background:linear-gradient(145deg,#151522,#0f0f18);
  box-shadow:0 30px 100px rgba(0,0,0,.55);animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:none}}
.close{float:right;border:0;background:rgba(255,255,255,.08);color:white;border-radius:50%;width:38px;height:38px;font-size:1.2rem;cursor:pointer}
.paper h2{font-size:2rem;margin:10px 45px 8px 0}.paper .sub{color:var(--muted);margin-bottom:24px}
.message{font-size:1.08rem;line-height:1.9;white-space:pre-line}
.secret{
  margin-top:28px;padding:18px;border-radius:18px;border:1px dashed rgba(185,167,255,.35);
  background:rgba(185,167,255,.06);color:#dcd5ff
}
.photo{
  width:100%;max-height:300px;object-fit:cover;border-radius:18px;margin:8px 0 22px;display:none
}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
@media(max-width:500px){.container{padding-top:35px}.card{padding:19px}.paper{padding:24px}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<main class="container">
  <section class="hero">
    <span class="badge">A little collection, made for you</span>
    <h1>Open When…</h1>
    <p>Different moments call for different things. Pick one whenever you feel like it.</p>
  </section>

  <section class="grid" id="cards"></section>
  <div class="footer">Made with care · come back whenever you need one</div>
</main>

<div class="modal" id="modal">
  <article class="paper">
    <button class="close" id="close" aria-label="Close">×</button>
    <h2 id="modalTitle"></h2>
    <div class="sub" id="modalSub"></div>
    <img class="photo" id="modalPhoto" alt="">
    <div class="message" id="modalMessage"></div>
    <div class="secret" id="modalSecret"></div>
  </article>
</div>

<script>
/*
  ==========================
  EDIT YOUR GIFT HERE
  ==========================
  Replace the text below. You can add/remove cards.
  To add a photo, put its filename in "photo" and upload it beside index.html.
*/
const gifts = [
  {
    icon:"🌧️",
    title:"Open when you're having a bad day",
    hint:"You don't have to fix everything at once.",
    message:`Hey.

Whatever happened today, you made it through another day. That's worth something.

Take a breath, get comfortable, drink some water, and give yourself permission to slow down for a while.

Tomorrow doesn't need to be solved tonight.`,
    secret:"One bad day doesn't get to define the whole story."
  },
  {
    icon:"🌙",
    title:"Open when you can't sleep",
    hint:"For those nights when your brain refuses to cooperate.",
    message:`Put your phone down for a moment after reading this.

Unclench your jaw. Drop your shoulders. Take a few slow breaths.

You don't need to figure everything out tonight. Let tomorrow's version of you deal with tomorrow's problems.`,
    secret:"Now seriously: go get some sleep."
  },
  {
    icon:"🫶",
    title:"Open when you need a reminder",
    hint:"A small reminder that you matter.",
    message:`You are more appreciated than you probably realize.

There are things about you that make you uniquely you, and those things are worth keeping.

Don't measure your entire worth by one conversation, one mistake, one grade, or one bad day.`,
    secret:"Keep going. Quiet progress is still progress."
  },
  {
    icon:"😂",
    title:"Open when you need to laugh",
    hint:"Emergency supply of nonsense.",
    message:`Official diagnosis:

You have opened the emergency laughter department.

Unfortunately, our highly trained scientists have concluded that the only treatment is remembering the dumbest inside joke you have.

If that doesn't work, repeat the word “potato” in a serious voice.`,
    secret:"This department has absolutely no medical qualifications."
  },
  {
    icon:"⭐",
    title:"Open when you doubt yourself",
    hint:"Read this before giving up on yourself.",
    message:`You don't have to be perfect to be capable.

Progress can be slow, messy, and completely invisible for a while. That doesn't make it fake.

Focus on the next small thing you can actually do. Then do that one thing.`,
    secret:"Future-you is going to be glad you kept going."
  },
  {
    icon:"🎉",
    title:"Open when something good happens",
    hint:"Yes, this one is mandatory.",
    message:`WAIT.

Something good happened?!

Then stop scrolling and actually enjoy it for a second.

Whatever it is, congratulations. You earned a moment to be happy about it.`,
    secret:"I hope there are many more reasons to open this one."
  },
  {
    icon:"🔐",
    title:"Open when you're curious",
    hint:"You probably shouldn't have clicked this.",
    message:`Congratulations.

You have discovered the completely unnecessary secret section.

There was no grand mystery.

You were simply too curious to leave the button alone.`,
    secret:"And honestly, I respect that."
  },
  {
    icon:"💬",
    title:"Open when you just want something to read",
    hint:"No particular reason needed.",
    message:`Here's your random reminder:

You don't always need a reason to take a break, enjoy something, or do something simply because it makes you happy.

Not every moment needs to be productive.`,
    secret:"This card exists solely because you clicked it."
  }
];

const cards = document.getElementById("cards");
const modal = document.getElementById("modal");
const title = document.getElementById("modalTitle");
const sub = document.getElementById("modalSub");
const message = document.getElementById("modalMessage");
const secret = document.getElementById("modalSecret");
const photo = document.getElementById("modalPhoto");

gifts.forEach((g,i)=>{
  const b=document.createElement("button");
  b.className="card";
  b.innerHTML=`<div class="icon">${g.icon}</div><div class="label">${g.title}</div><div class="hint">${g.hint}</div>`;
  b.onclick=()=>openGift(i);
  cards.appendChild(b);
});

function openGift(i){
  const g=gifts[i];
  title.textContent=g.title;
  sub.textContent=g.hint;
  message.textContent=g.message;
  secret.textContent=g.secret;

  if(g.photo){
    photo.src=g.photo; photo.style.display="block";
  } else {
    photo.style.display="none"; photo.removeAttribute("src");
  }

  modal.classList.add("show");
  if(i===5) confetti();
}

function closeModal(){modal.classList.remove("show")}
document.getElementById("close").onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

function confetti(){
  const c=document.getElementById("confetti"),ctx=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  const pieces=Array.from({length:110},()=>({
    x:innerWidth/2,y:innerHeight*.35,
    vx:(Math.random()-.5)*12,vy:Math.random()*-10-3,
    size:Math.random()*7+3,life:90+Math.random()*50
  }));
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p=>{
      p.x+=p.vx;p.vy+=.25;p.y+=p.vy;p.life--;
      ctx.globalAlpha=Math.max(0,p.life/120);
      ctx.fillStyle=`hsl(${(frame*4+p.x)%360},80%,70%)`;
      ctx.fillRect(p.x,p.y,p.size,p.size);
    });
    frame++;
    if(frame<130)requestAnimationFrame(draw); else ctx.clearRect(0,0,c.width,c.height);
  }
  draw();
}
</script>
</body>
</html>
